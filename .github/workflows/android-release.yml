name: Android Build & Release

# Pipeline de empaquetado Android. El build de depuración corre siempre y no
# requiere secretos. El build de release sólo produce un artefacto firmado y
# apto para Play Store cuando los secretos de firma y de Supabase de producción
# están configurados en el repositorio (ver docs/deployment/04-android-release-signing.md
# y docs/deployment/01-supabase-project.md). Si faltan, el job sigue ejecutándose
# para no bloquear el pipeline, pero sube un artefacto firmado con la clave debug
# y lo marca explícitamente como no apto para publicar — nunca se simula un
# artefacto de producción.

on:
  push:
    branches: ["feature/**"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Construir el artefacto de release (APK + AAB) además del debug"
        type: boolean
        default: false

env:
  FLUTTER_CHANNEL: stable

jobs:
  debug-build:
    name: Debug APK (build sanity)
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        working-directory: frontend
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: agrocampo-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  release-build:
    name: Release APK + AAB (guarded by secrets)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get

      - name: Check which release secrets are configured
        id: check
        run: |
          has_keystore=false
          has_supabase=false
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            has_keystore=true
          fi
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            has_supabase=true
          fi
          echo "has_keystore=$has_keystore" >> "$GITHUB_OUTPUT"
          echo "has_supabase=$has_supabase" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.check.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/release.keystore
          cat > frontend/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/release.keystore
          EOF

      - name: Build release APK + AAB
        working-directory: frontend
        env:
          MAP_TILE_URL: ${{ secrets.MAP_TILE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          DEFINES=()
          if [ -n "$MAP_TILE_URL" ]; then
            DEFINES+=("--dart-define=MAP_TILE_URL=$MAP_TILE_URL")
          fi
          if [ "${{ steps.check.outputs.has_supabase }}" = "true" ]; then
            DEFINES+=("--dart-define=AGROCAMPO_ENV=production")
            DEFINES+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
            DEFINES+=("--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY")
          fi
          flutter build apk --release --no-pub "${DEFINES[@]}"
          flutter build appbundle --release --no-pub "${DEFINES[@]}"

      - name: Flag artifacts that are not production-ready
        if: steps.check.outputs.has_keystore != 'true' || steps.check.outputs.has_supabase != 'true'
        run: |
          echo "::warning::Este artefacto NO está listo para Play Store — keystore configurado: ${{ steps.check.outputs.has_keystore }}, Supabase de producción configurado: ${{ steps.check.outputs.has_supabase }}. Ver docs/deployment/04-android-release-signing.md y docs/deployment/01-supabase-project.md antes de publicar."

      - uses: actions/upload-artifact@v4
        with:
          name: agrocampo-release-${{ steps.check.outputs.has_keystore == 'true' && 'signed' || 'UNSIGNED-debugkey' }}
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
