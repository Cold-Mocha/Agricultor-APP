name: agrocampo_backend
description: Lógica y persistencia offline de AgroCampo, sin interfaz visual.
publish_to: none
version: 1.0.0
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 7.3.1
  crypto: 3.0.7
  drift: 2.34.3
  drift_flutter: 0.3.1
  excel: 4.0.6
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0
  flutter_local_notifications: 22.3.0
  flutter_riverpod: 3.4.2
  flutter_secure_storage: 10.3.1
  geolocator: 14.0.3
  image_picker: 1.2.3
  local_auth: 3.0.2
  path: 1.9.1
  path_provider: 2.1.5
  supabase_flutter: 2.17.2
  timezone: 0.11.1
  url_launcher: 6.3.2
  uuid: 4.5.2
  workmanager: 0.10.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.0
  drift_dev: 2.34.5
  mocktail: 1.0.4
  flutter_lints: ^6.0.0
dependency_overrides:
  path_provider_android: 2.2.23
flutter:
  assets:
    - assets/data/
